<!doctype html>
<html lang="es-AR">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<title>Don Valentín — composición experimental (descartable)</title>
<style>
  /* Fase 0 — experimento descartable. No es producto. Sin librerías ni imágenes. */
  :root {
    --carbon: #1a1613;
    --carbon-2: #231d18;
    --brasa: #ff5a1f;
    --terracota: #b8573a;
    --crema: #f2e7d1;
    --display: "Rockwell", "Rockwell Nova", "Clarendon", "Bookman Old Style", "Roboto Slab", Georgia, serif;
    --texto: "Gill Sans", "Gill Sans MT", "Trebuchet MS", "Segoe UI", sans-serif;
    --gutter: clamp(16px, 4vw, 56px);
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; }
  body {
    background: var(--carbon);
    color: var(--crema);
    font-family: var(--texto);
  }

  .hero {
    position: relative;
    min-height: 100svh;
    overflow: hidden;
    padding: var(--gutter);
    display: grid;
    grid-template-rows: 1fr auto;
    background:
      radial-gradient(120% 55% at 30% 108%, rgb(255 90 31 / .38), transparent 62%),
      linear-gradient(180deg, var(--carbon) 40%, var(--carbon-2));
  }

  /* El nombre: dos capas apiladas. Arriba, el relleno cortado por barras de parrilla.
     Abajo, la brasa que se asoma entre las barras. */
  .nombre {
    --size: clamp(64px, 21vw, 360px);
    align-self: center;
    display: grid;
    margin: 0;
    font-family: var(--display);
    font-weight: 800;
    font-size: var(--size);
    line-height: .8;
    letter-spacing: -.035em;
    position: relative;
    z-index: 2;
  }
  .nombre > span { grid-area: 1 / 1; display: block; }
  .nombre .linea { display: block; }
  .nombre .don { padding-left: 1.55em; font-size: .62em; line-height: 1; margin-bottom: -.02em; }
  .nombre .valentin { margin-left: -.04em; }

  .relleno {
    background: linear-gradient(180deg, var(--crema) 8%, #f0b98a 42%, var(--terracota) 66%, var(--brasa) 96%);
    -webkit-background-clip: text; background-clip: text;
    color: transparent;
    -webkit-mask-image: repeating-linear-gradient(180deg, #000 0 .13em, transparent .13em .147em);
            mask-image: repeating-linear-gradient(180deg, #000 0 .13em, transparent .13em .147em);
    animation: encender 3.2s cubic-bezier(.3,.1,.2,1) both;
  }
  .brasa {
    color: var(--brasa);
    filter: blur(.045em) url(#calor);
    opacity: .9;
    animation: brasa-in 3.2s ease-out both, respirar 4.6s ease-in-out 3.2s infinite;
  }

  @keyframes encender {
    from { filter: brightness(.28) saturate(.5); }
    to   { filter: none; }
  }
  @keyframes brasa-in { from { opacity: 0; } to { opacity: .9; } }
  @keyframes respirar { 0%, 100% { opacity: .9; } 50% { opacity: .55; } }

  .pie {
    display: grid;
    grid-template-columns: minmax(0, 34ch) 1fr;
    gap: 1.5rem 3rem;
    align-items: end;
    padding-top: 1.5rem;
    border-top: 2px solid var(--terracota);
    position: relative;
    z-index: 2;
  }
  .pie p { margin: 0; font-size: clamp(1.05rem, 1.5vw, 1.3rem); line-height: 1.45; }
  .pie .desde {
    font-family: var(--display);
    font-size: clamp(1.4rem, 2.6vw, 2.2rem);
    font-weight: 700;
    line-height: 1.15;
    margin-bottom: .4rem;
  }
  .accion { justify-self: end; text-align: right; display: grid; gap: .6rem; }
  .accion a {
    display: inline-block;
    padding: .85rem 1.4rem;
    background: var(--brasa);
    color: var(--carbon);
    font-weight: 700;
    font-size: 1.1rem;
    text-decoration: none;
    border-radius: 2px;
    justify-self: end;
    transition: background-color .2s;
  }
  .accion a:hover { background: var(--crema); }
  .accion a:focus-visible { outline: 3px solid var(--crema); outline-offset: 4px; }
  .accion small { color: #cdbfa6; font-size: .9rem; }

  /* Chispas */
  .chispas { position: absolute; inset: 0; pointer-events: none; z-index: 1; }
  .chispas i {
    position: absolute; bottom: -10px;
    width: var(--s); height: var(--s);
    border-radius: 50%;
    background: var(--brasa);
    box-shadow: 0 0 8px 2px rgb(255 90 31 / .7);
    opacity: 0;
    animation: subir var(--d) linear var(--t) infinite;
  }
  @keyframes subir {
    0%   { transform: translate(0, 0); opacity: 0; }
    10%  { opacity: .9; }
    100% { transform: translate(var(--x), -75vh); opacity: 0; }
  }

  @media (max-width: 640px) {
    .nombre { --size: 24vw; }
    .nombre .don { padding-left: 1.1em; }
    .pie { grid-template-columns: 1fr; }
    .accion, .accion a { justify-self: start; text-align: left; }
  }

  @media (prefers-reduced-motion: reduce) {
    .relleno, .brasa { animation: none; }
    .brasa { opacity: .75; }
    .chispas { display: none; }
    .accion a { transition: none; }
  }
</style>
</head>
<body>
<main>
  <section class="hero" aria-labelledby="titulo">
    <svg width="0" height="0" aria-hidden="true" focusable="false" style="position:absolute">
      <filter id="calor" x="-5%" y="-10%" width="110%" height="120%">
        <feTurbulence type="fractalNoise" baseFrequency="0.012 0.05" numOctaves="2" seed="4"/>
        <feDisplacementMap in="SourceGraphic" scale="14" xChannelSelector="R" yChannelSelector="G"/>
      </filter>
    </svg>

    <div class="chispas" id="chispas" aria-hidden="true"></div>

    <h1 class="nombre" id="titulo">
      <span class="relleno"><span class="linea don">Don</span><span class="linea valentin">Valentín</span></span>
      <span class="brasa" aria-hidden="true"><span class="linea don">Don</span><span class="linea valentin">Valentín</span></span>
    </h1>

    <div class="pie">
      <div>
        <p class="desde">Parrilla familiar, desde 1994.</p>
        <p>En San Miguel, Buenos Aires. Parrilla libre, atendida en el salón.</p>
      </div>
      <div class="accion">
        <a href="#reservas">Reservá tu mesa</a>
        <small>[DATO PENDIENTE: horarios y canal de reservas]</small>
      </div>
    </div>
  </section>
</main>

<script>
  // Chispas: solo si la persona no pidió menos movimiento.
  if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
    var c = document.getElementById("chispas");
    for (var i = 0; i < 16; i++) {
      var e = document.createElement("i");
      e.style.setProperty("left", (8 + Math.random() * 84) + "%");
      e.style.setProperty("--s", (2 + Math.random() * 3) + "px");
      e.style.setProperty("--d", (5 + Math.random() * 5) + "s");
      e.style.setProperty("--t", (3 + Math.random() * 6) + "s");
      e.style.setProperty("--x", ((Math.random() - 0.5) * 120) + "px");
      c.appendChild(e);
    }
  }
</script>
</body>
</html>
