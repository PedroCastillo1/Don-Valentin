<!doctype html>
<html lang="es-AR">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Prueba de Fase 0</title>
    <style>
      :root {
        --carbon: #1b1512;
        --crema: #f4ead8;
        --brasa: #c2410c;
      }
      body {
        margin: 0;
        background: var(--carbon);
        color: var(--crema);
        font-family: Georgia, serif;
      }
      main {
        min-height: 100vh;
        display: grid;
        place-content: center;
        gap: 1rem;
        padding: 2rem;
      }
      h1 {
        font-size: clamp(2.5rem, 8vw, 6rem);
        margin: 0;
      }
      .linea {
        height: 4px;
        width: 0;
        background: var(--brasa);
      }
      button {
        justify-self: start;
        background: var(--brasa);
        color: #fff;
        border: 0;
        padding: 0.75rem 1.25rem;
        min-height: 44px;
        font-size: 1rem;
      }
      .espacio {
        height: 120vh;
      }
    </style>
  </head>
  <body>
    <main>
      <h1 id="titulo">Reservá tu mesa</h1>
      <div class="linea" id="linea" role="presentation"></div>
      <button type="button" id="btn">Reservar mesa</button>
    </main>
    <div class="espacio"></div>
    <script src="vendor/gsap.min.js"></script>
    <script src="vendor/ScrollTrigger.min.js"></script>
    <script>
      gsap.registerPlugin(ScrollTrigger);
      const mm = gsap.matchMedia();
      mm.add("(prefers-reduced-motion: no-preference)", () => {
        gsap.from("#titulo", { y: 60, opacity: 0, duration: 1.2, ease: "power3.out" });
        gsap.to("#linea", { width: "320px", duration: 1.2, ease: "expo.inOut", delay: 0.2 });
      });
      mm.add("(prefers-reduced-motion: reduce)", () => {
        gsap.set("#linea", { width: "320px" });
      });
      window.__gsap = gsap.version;
      window.__st = () => ScrollTrigger.getAll().length;
    </script>
  </body>
</html>
